[package]
name = "serialmind"
version = "0.1.0"
description = "SerialMind — 跨平台智能串口调试工作台"
authors = ["SerialMind"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "serialmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
